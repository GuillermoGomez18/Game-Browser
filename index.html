<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Browser | Inicio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app-container">

        <aside class="sidebar">
            <div class="sidebar-menu">
                <a href="#" class="menu-item">👤 Iniciar sesion / Perfil</a>
                <a href="#" class="menu-item active">🏠 Inicio</a>
                <a href="#" class="menu-item">➕ Añadir reseña</a>
                <a href="#" class="menu-item">❓ Ayuda</a>
            </div>
        </aside>

        <main class="main-content">
            
            <header class="top-header">
                <div class="logo-area">
                    <h2>Game Browser</h2>
                </div>
                <div class="search-bar">
                    <input type="text" placeholder="🔍 Buscar juego...">
                </div>
            </header>

            <section class="novedades-section">
                <h3>Novedades</h3>
                
                <div class="grid-juegos">
                    <article class="juego-card">
                        <div class="imagen-placeholder">IMG</div>
                        <div class="info">
                            <h4>Persona 5 Royal</h4>
                            <p>RPG, PlayStation, PC</p>
                        </div>
                    </article>

                    <article class="juego-card">
                        <div class="imagen-placeholder">IMG</div>
                        <div class="info">
                            <h4>Helldivers 2</h4>
                            <p>Shooter, PS5, PC</p>
                        </div>
                    </article>

                    <article class="juego-card">
                        <div class="imagen-placeholder">IMG</div>
                        <div class="info">
                            <h4>Some text</h4>
                            <p>Género, plataformas</p>
                        </div>
                    </article>
                    
                    <article class="juego-card">
                        <div class="imagen-placeholder">IMG</div>
                        <div class="info">
                            <h4>Some text</h4>
                            <p>Género, plataformas</p>
                        </div>
                    </article>
                </div>
            </section>
        </main>

    </div>

</body>
</html>
