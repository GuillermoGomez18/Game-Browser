<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Browser | Inicio Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-inicio">
    <div class="nav-control-header">
    <button class="btn-menu-toggle" onclick="toggleMenu()">☰ </button>
    <span style="margin-left: 15px; font-weight: bold; color: #a0c4ff;">GameBrowser</span>
</div>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-menu">
                <div class="sidebar-header">
                    <a href="perfil.html" class="menu-item" id="user-link">👤 Perfil / Login</a>
                    
                </div>    
                <a href="index.html" class="menu-item active">🏠 Inicio</a>
                <a href="busqueda.html" class="menu-item">🎮 Juegos</a>
                <a href="consolas.html" class="menu-item">🕹️ Consolas</a>
                <a href="reseñas.html" class="menu-item">➕ Añadir reseña</a>
                <a href="ayuda.html" class="menu-item">❓ Ayuda</a>
            </div>
        </aside>

        <button class="btn-open-sidebar" onclick="toggleMenu()">☰</button>

        <main class="main-content" id="main-content">
            <header class="top-header">
                <div class="logo-area"><h2>Game Browser</h2></div>
                <div class="search-bar-modern">
                    <input type="text" id="globalSearch" placeholder="Buscar juego real...">
                    <button class="search-icon" id="btnSearch">🔍</button>
                </div>
            </header>

            <section class="novedades-section">
                <h3>Novedades (Cargadas desde RAWG API)</h3>
                <div class="grid-juegos" id="contenedor-juegos">
                    <p>Cargando catálogo de juegos...</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        // 1. CONFIGURACIÓN DE LA API
        const API_KEY = '87246c155ff944ebbe403cb842778903'; // <--- PON TU CLAVE AQUÍ
        const URL_API = `https://api.rawg.io/api/games?key=${API_KEY}&page_size=12`;

        async function cargarJuegosAPI() {
            try {
                const respuesta = await fetch(URL_API);
                const datos = await respuesta.json();
                const contenedor = document.getElementById('contenedor-juegos');
                contenedor.innerHTML = ''; // Limpiar mensaje de carga

                datos.results.forEach(juego => {
                    const card = `
                        <article class="juego-card">
                            <div class="imagen-placeholder">
                                <img src="${juego.background_image || 'img/no-image.jpg'}" alt="${juego.name}">
                            </div>
                            <div class="info">
                                <h4>${juego.name}</h4>
                                <p>${juego.genres.map(g => g.name).join(', ')}</p>
                                <small>⭐ Rating: ${juego.rating}</small>
                            </div>
                        </article>
                    `;
                    contenedor.innerHTML += card;
                });
            } catch (error) {
                console.error("Error API:", error);
                document.getElementById('contenedor-juegos').innerHTML = "<p>Error al conectar con la base de datos.</p>";
            }
        }

        // 2. LÓGICA DEL BUSCADOR (CORREGIDA)
        function ejecutarBusqueda() {
            const query = document.getElementById('globalSearch').value.trim();
            if (query.length > 2) {
                // Redirigimos a la página de búsqueda con el parámetro
                window.location.href = `busqueda.html?query=${encodeURIComponent(query)}`;
            } else {
                alert("Escribe al menos 3 letras.");
            }
        }

        document.getElementById('btnSearch').onclick = ejecutarBusqueda;
        document.getElementById('globalSearch').onkeypress = (e) => {
            if (e.key === 'Enter') ejecutarBusqueda();
        };

        // 3. FUNCIONES DE INTERFAZ
        function toggleMenu() {
    const side = document.getElementById('sidebar');
    const main = document.getElementById('main-content'); // Asegúrate que tu <main> tenga este ID
    side.classList.toggle('hidden');
    main.classList.toggle('full-width');
}

        window.onload = function() {
            cargarJuegosAPI(); // Carga los juegos al abrir
            const display = document.getElementById('user-link');
            const user = localStorage.getItem('usuarioLogueado');
            if (user && display) {
                display.innerHTML = `👤 Hola, ${user}`;
            }
        };
    </script>
</body>
</html>
