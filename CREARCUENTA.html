<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameBrowser - Registro de Usuario</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Librería oficial de Google -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="pagina-login-full">
    <div class="login-wrapper">
        <header class="login-header">
            <div class="main-logo-gif">
                <img src="img/logo1.webp" alt="Avatar">
            </div>
            <h1 class="brand-name" style="color: white; margin-top: 10px;">GAMEBROWSER</h1>
        </header>

        <main class="login-card-modern">
            <h2>Crear Nueva Cuenta</h2>
            
            <!-- Botón de Registro Rápido con Google -->
            <div id="g_id_onload"
                 data-client_id="877139663201-vcshbenc38gisjljuotlo1ilva1j1v1b.apps.googleusercontent.com"
                 data-callback="handleGoogleRegistration"
                 data-ux_mode="popup"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="outline" data-text="signup_with" data-size="large" data-logo_alignment="left" style="margin-bottom: 20px;"></div>

            <div class="social-divider">
                <span>O REGISTRO MANUAL</span>
            </div>

            <form id="registroForm">
                <div class="input-group">
                    <label>Nombre de usuario</label>
                    <input type="text" id="regUser" placeholder="Ej. Joker123" required>
                </div>
                <div class="input-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="regEmail" placeholder="usuario@ues.mx" required>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="regPass" placeholder="••••••••" required>
                </div>
                <div class="input-group">
                    <label>Confirmar contraseña</label>
                    <input type="password" id="regConfirm" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit-main">Crear Cuenta Ahora</button>
                
                <div class="forgot-link">
                    <a href="Loguin.html">¿Ya tienes cuenta? Inicia sesión aquí</a>
                </div>
            </form>
        </main>
    </div>

    <script>
        // 1. MANEJO DE REGISTRO CON GOOGLE
        function handleGoogleRegistration(response) {
            const responsePayload = parseJwt(response.credential);

            // Extraemos los datos para "crear" el perfil instantáneamente
            const nombre = responsePayload.given_name;
            const email = responsePayload.email;
            const foto = responsePayload.picture;

            // Guardamos en el sistema local para simular la persistencia de Ingeniería
            localStorage.setItem('usuarioLogueado', nombre);
            localStorage.setItem(`${nombre}_email`, email);
            localStorage.setItem(`${nombre}_foto`, foto);

            alert(`¡Registro exitoso! Bienvenido a GameBrowser, ${nombre}.`);
            window.location.href = 'index.html';
        }

        // Función para decodificar el Token de Google
        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // 2. REGISTRO MANUAL
        document.getElementById('registroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nombre = document.getElementById('regUser').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            const confirm = document.getElementById('regConfirm').value;

            if (pass !== confirm) {
                alert("Las contraseñas no coinciden.");
                return;
            }

            // Simulación de base de datos en LocalStorage
            const usuarios = JSON.parse(localStorage.getItem('usuariosApp')) || [];
            
            // Verificar si el usuario ya existe
            if (usuarios.find(u => u.nombre === nombre)) {
                alert("El nombre de usuario ya está en uso.");
                return;
            }

            usuarios.push({ nombre: nombre, email: email, pass: pass });
            localStorage.setItem('usuariosApp', JSON.stringify(usuarios));
            
            // Auto-logueo tras registro exitoso
            localStorage.setItem('usuarioLogueado', nombre);
            localStorage.setItem(`${nombre}_email`, email);

            alert('¡Cuenta creada exitosamente! Bienvenido a GameBrowser.');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
