<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameBrowser - Registro</title>
    <style>
        :root { --azul: #a0c4ff; }
        body { font-family: Arial; background: #f4f4f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: var(--azul); padding: 50px; border: 2px solid #000; border-radius: 15px; width: 500px; text-align: center; }
        h2 { margin-bottom: 30px; }
        input { width: 90%; padding: 12px; margin-bottom: 20px; border: 2px solid #000; border-radius: 5px; }
        .btn-register { background: #000; color: #fff; padding: 15px 40px; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; }
        .back-link { display: block; margin-top: 20px; color: #0033aa; text-decoration: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Crear Nueva Cuenta</h2>
    <form onsubmit="event.preventDefault(); alert('Cuenta creada con éxito. Ahora inicia sesión.'); window.location.href='index.html';">
        <input type="text" placeholder="Nombre de usuario" required>
        <input type="email" placeholder="Correo electrónico" required>
        <input type="password" placeholder="Contraseña" required>
        <input type="password" placeholder="Confirmar contraseña" required>
        <button type="submit" class="btn-register">Registrarse</button>
    </form>
    <a href="Loguin.html" class="back-link">¿Ya tienes cuenta? Volver al login</a>
</div>

</body>
</html>
