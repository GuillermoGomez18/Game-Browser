<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameBrowser | Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Librería oficial de Google -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="pagina-login-full">

    <div class="login-container-flex">
        <header class="login-header">
            <div class="main-logo-gif">
                <img src="img/logo1.webp" alt="Logo GameBrowser">
            </div>
            <h1 class="brand-name">GAMEBROWSER</h1>
            <p style="color: var(--azul-primario); font-weight: bold;">Ingeniería en Software - UES</p>
        </header>

        <div class="login-card-modern">
            <!-- Botón de Google -->
            <div id="g_id_onload"
                 data-client_id="877139663201-vcshbenc38gisjljuotlo1ilva1j1v1b.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-ux_mode="popup"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="filled_blue" data-text="signin_with" data-size="large" data-logo_alignment="left"></div>

            <div class="social-divider">
                <span>O CON TU CUENTA</span>
            </div>

            <!-- Formulario Tradicional -->
            <form id="form-login-local" onsubmit="loginLocal(event)">
                <div style="margin-bottom: 15px;">
                    <input type="text" id="user-input" placeholder="Usuario o Correo" required>
                </div>
                <div style="margin-bottom: 20px;">
                    <input type="password" id="pass-input" placeholder="Contraseña" required>
                </div>
                <button type="submit" class="btn-submit-main" style="width: 100%;">Entrar al Sistema</button>
            </form>

            <p style="text-align: center; margin-top: 20px; font-size: 0.9rem;">
                ¿No tienes cuenta? <a href="CREARCUENTA.html" style="color: var(--azul-primario);">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <script>
        // 1. MANEJO DE RESPUESTA DE GOOGLE
        function handleCredentialResponse(response) {
            // Decodificamos el JWT enviado por Google
            const responsePayload = parseJwt(response.credential);

            // Extraemos datos clave
            const nombreUsuario = responsePayload.given_name;
            const correoUsuario = responsePayload.email;
            const fotoUsuario = responsePayload.picture;

            // Guardamos en LocalStorage para que todo el sitio lo reconozca
            localStorage.setItem('usuarioLogueado', nombreUsuario);
            localStorage.setItem(`${nombreUsuario}_email`, correoUsuario);
            localStorage.setItem(`${nombreUsuario}_foto`, fotoUsuario);

            alert(`¡Bienvenido de nuevo, ${nombreUsuario}!`);
            window.location.href = "index.html"; // Redirigir al inicio
        }

        // Función para decodificar el Token de Google
        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // 2. LOGIN LOCAL (TRADICIONAL)
        function loginLocal(event) {
            event.preventDefault();
            const user = document.getElementById('user-input').value;
            const pass = document.getElementById('pass-input').value;

            // Validación simple para tu proyecto de Ingeniería
            if (user.length >= 3 && pass.length >= 4) {
                localStorage.setItem('usuarioLogueado', user);
                // Si no tiene correo guardado, le asignamos el institucional por defecto
                if(!localStorage.getItem(`${user}_email`)) {
                    localStorage.setItem(`${user}_email`, `${user}@ues.mx`);
                }
                window.location.href = "index.html";
            } else {
                alert("Por favor ingresa credenciales válidas.");
            }
        }

        // Redirigir si ya está logueado
        if (localStorage.getItem('usuarioLogueado')) {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
