<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameBrowser - Login</title>
    <style>
        :root {
            --azul-wireframe: #a0c4ff;
            --negro-boton: #000000;
            --blanco: #ffffff;
            --gris-borde: #ccc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Contenedor Principal más grande */
        .browser-container {
            width: 95%;
            max-width: 1200px;
            background-color: var(--blanco);
            border: 2px solid var(--gris-borde);
            border-radius: 12px;
            position: relative;
            padding: 60px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* Espacio para el GIF */
        .gif-container {
            position: absolute;
            top: 25px;
            left: 25px;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gif-container img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .header-title {
            text-align: center;
            font-size: 56px; /* Más grande */
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        /* Caja de Login */
        .login-card {
            background-color: var(--azul-wireframe);
            width: 100%;
            max-width: 650px; /* Más ancha */
            margin: 0 auto;
            border: 2px solid #000;
            padding: 50px;
            border-radius: 15px;
        }

        .login-card h2 {
            text-align: center;
            font-size: 32px;
            margin-bottom: 40px;
            text-transform: capitalize;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .form-row label {
            width: 150px;
            font-size: 20px;
            font-weight: bold;
        }

        .form-row input {
            flex-grow: 1;
            padding: 12px;
            border: 2px solid #000;
            font-size: 18px;
            border-radius: 5px;
        }

        .checkbox-row {
            text-align: center;
            margin: 25px 0;
            font-size: 18px;
        }

        .main-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-bottom: 30px;
        }

        .btn-black {
            background-color: var(--negro-boton);
            color: var(--blanco);
            padding: 15px 45px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
        }

        .link-text {
            color: #0033aa;
            text-decoration: underline;
            cursor: pointer;
            font-size: 16px;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
        }

        .line {
            height: 2px;
            background: #000;
            width: 150px;
        }

        .circle-o {
            margin: 0 20px;
            font-size: 30px;
            font-weight: bold;
        }

        .secondary-actions {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .btn-white {
            background-color: var(--blanco);
            border: 2px solid #000;
            padding: 12px 30px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="browser-container">
    <div class="gif-container">
        <img src="img/persona-persona5.gif" alt="Animación">
    </div>

    <h1 class="header-title">GameBrowser</h1>

    <div class="login-card">
        <h2>inicio de sesión</h2>
        
        <form id="loginForm">
            <div class="form-row">
                <label for="user">Usuario</label>
                <input type="text" id="user" required>
            </div>
            
            <div class="form-row">
                <label for="pass">Contraseña</label>
                <input type="password" id="pass" required>
            </div>

            <div class="checkbox-row">
                <input type="checkbox" id="remember">
                <label for="remember">Recordar contraseña</label>
            </div>

            <div class="main-actions">
                <button type="submit" class="btn-black">Iniciar Sesion</button>
                <span class="link-text" onclick="alert('Sistema de recuperación: Revisa tu correo.')">Olvide mi contraseña</span>
            </div>

            <div class="divider">
                <div class="line"></div>
                <span class="circle-o">O</span>
                <div class="line"></div>
            </div>

            <div class="secondary-actions">
                <button type="button" class="btn-white" onclick="window.location.href='CREARCUENTA.html'">Crear cuenta</button>
                <button type="button" class="btn-white" onclick="window.location.href='https://accounts.google.com/signin'">Iniciar con google</button>
            </div>
        </form>
    </div>
</div>

<script>
  
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const userValue = document.getElementById('user').value.toLowerCase(); // Convertimos a minúsculas para evitar errores
    const passValue = document.getElementById('pass').value;

    // Lista de usuarios autorizados
    const usuariosPermitidos = ["admin", "guillermo", "miguel", "fco"];
    
    // 1. Verificar si es uno de los usuarios predefinidos
    // 2. Verificar si es un usuario que se registró recién (buscando en localStorage)
    const usuariosRegistrados = JSON.parse(localStorage.getItem('usuariosApp')) || [];
    const usuarioNuevo = usuariosRegistrados.find(u => u.nombre.toLowerCase() === userValue && u.pass === passValue);

    if ((usuariosPermitidos.includes(userValue) && passValue === "1234") || usuarioNuevo) {
        // Guardamos el nombre para que aparezca en el Sidebar azul [cite: 2]
        localStorage.setItem('usuarioLogueado', userValue); 
        
        alert("¡Bienvenido a GameBrowser!");
        window.location.href = "index.html"; 
    } else {
        alert("Credenciales incorrectas. Prueba con admin, guillermo, miguel o fco (Pass: 1234)");
    }
});
</script>

</body>
</html>
