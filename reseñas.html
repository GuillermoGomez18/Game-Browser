<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Browser | Reseñas Dinámicas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pagina-resenas">
    <div class="nav-control-header">
    <button class="btn-menu-toggle" onclick="toggleMenu()">☰ MENU</button>
    <span style="margin-left: 15px; font-weight: bold; color: #a0c4ff;">GameBrowser</span>
</div>
    <div class="app-container">
        <!-- Sidebar consistente -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-menu">
                <div class="sidebar-header">
                    <a href="perfil.html" class="menu-item" id="user-link">👤 Perfil</a>
                   
                </div>
                <a href="index.html" class="menu-item">🏠 Inicio</a>
                <a href="busqueda.html" class="menu-item">🎮 Juegos</a>
                <a href="reseñas.html" class="menu-item active">➕ Añadir reseña</a>
                <a href="ayuda.html" class="menu-item">❓ Ayuda</a>
            </div>
        </aside>

        <button class="btn-open-sidebar" onclick="toggleMenu()">☰</button>

        <main class="main-content">
            <header class="top-header">
                <div class="logo-area-inline">
                    <div class="profile-mini-gif">
                        <img src="img/logo1.webp" alt="Logo">
                    </div>
                    <h1>Gamebrowser</h1>
                </div>
            </header>

            <section class="game-selected-section">
                <h2 class="section-title">Escribir Reseña</h2>
                
                <div class="main-info-grid">
                    <!-- CONTENEDOR DE LA API -->
                    <div class="game-poster-container">
                        <!-- Estos IDs son los que el script llenará con la imagen de la API -->
                        <img id="api-game-img" src="" alt="Cargando portada...">
                        <div class="game-card-info">
                            <h3 id="api-game-title" style="color: white; margin-top: 10px;">Cargando nombre...</h3>
                        </div>
                    </div>

                    <div class="game-details-container">
                        <div class="opinion-input-area" style="height: 100%;">
                            <label style="color: white; font-size: 1.2rem; margin-bottom: 10px; display: block;">¿Qué te pareció este juego?</label>
                            <textarea id="reviewText" placeholder="Cuéntanos tu experiencia con este título..." style="height: 300px; width: 100%; border-radius: 15px; padding: 20px; font-size: 1rem; border: none;"></textarea>
                            <button class="btn-submit-main" onclick="guardarResena()" style="margin-top: 20px; width: 100%;">Publicar Reseña</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        function toggleMenu() {
            const side = document.getElementById('sidebar');
            if (side) side.classList.toggle('hidden');
        }

        // --- FUNCIÓN CLAVE: CARGAR DATOS DE LA API ---
        window.onload = function() {
            const display = document.getElementById('user-link');
            const user = localStorage.getItem('usuarioLogueado');
            
            // 1. Obtenemos lo que guardamos en InformacionJuego.html
            const nombreJuego = localStorage.getItem('juegoSeleccionadoNombre');
            const imagenJuego = localStorage.getItem('juegoSeleccionadoImg');

            // 2. Inyectamos la imagen y el nombre en el HTML
            if (nombreJuego && imagenJuego) {
                document.getElementById('api-game-title').innerText = nombreJuego;
                document.getElementById('api-game-img').src = imagenJuego;
            } else {
                // Si entra directo sin elegir juego, ponemos algo por defecto
                document.getElementById('api-game-title').innerText = "Selecciona un juego primero";
                document.getElementById('api-game-img').src = "img/no-image.jpg";
            }

            // 3. Mostrar usuario en sidebar
            if (user && display) {
                display.innerHTML = `👤 Hola, ${user}`;
                display.href = "perfil.html";
            }
        };

        function guardarResena() {
            const texto = document.getElementById('reviewText').value;
            const user = localStorage.getItem('usuarioLogueado') || "Usuario Anónimo";
            const juego = localStorage.getItem('juegoSeleccionadoNombre') || "Juego Desconocido";

            if (texto.trim() === "") {
                alert("Por favor, escribe algo antes de enviar.");
                return;
            }

            // Guardar en el historial de reseñas
            let resenas = JSON.parse(localStorage.getItem('misResenas')) || [];
            const nuevaResena = {
                usuario: user,
                juego: juego,
                contenido: texto,
                fecha: new Date().toLocaleDateString()
            };

            resenas.push(nuevaResena);
            localStorage.setItem('misResenas', JSON.stringify(resenas));

            alert(`¡Reseña de ${juego} publicada!`);
            window.location.href = "perfil.html"; // Redirigir para ver el resultado
        }
    </script>
</body>
</html>
